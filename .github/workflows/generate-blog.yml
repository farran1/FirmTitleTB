name: Generate Blog from Google Sheet

on:
  schedule:
    # Hourly from 6 AM to 11 PM Eastern (11:00–04:00 UTC). Runs with no sheet
    # changes produce no commit, so frequent runs cost nothing on the site.
    - cron: '7 0-4,11-23 * * *'
  workflow_dispatch: # "Run workflow" button on the Actions tab publishes immediately
    inputs:
      allow_shrink:
        description: 'Allow removing more than half of the live posts (only if you meant to unpublish them)'
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs push at the same time.
concurrency:
  group: generate-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the blog generator
        run: node --test scripts/generate-blog.test.js

      - name: Generate blog pages
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Sheet1' }}
          BLOG_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: node scripts/generate-blog.js

      - name: Check the generated site
        run: |
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml'); m.parse('blog/feed.xml')"
          for loc in $(grep -o '<loc>https://firmtitletb.com/blog[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g'); do
            path="${loc#https://firmtitletb.com/}"
            [ -f "$path/index.html" ] || { echo "::error::$loc has no page"; exit 1; }
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Auto-update blog posts from Google Sheet"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the blog update"
          exit 1
